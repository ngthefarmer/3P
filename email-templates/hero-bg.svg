<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fafc"/>
      <stop offset="100%" stop-color="#f3f5fa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="280" fill="url(#bg)"/>

  <!-- top-left network graph -->
  <g stroke="#c7d0e6" stroke-width="1" opacity="0.8" fill="none">
    <line x1="10" y1="18" x2="58" y2="10"/>
    <line x1="58" y1="10" x2="92" y2="34"/>
    <line x1="58" y1="10" x2="40" y2="46"/>
    <line x1="40" y1="46" x2="10" y2="60"/>
    <line x1="40" y1="46" x2="76" y2="64"/>
    <line x1="92" y1="34" x2="76" y2="64"/>
    <line x1="10" y1="60" x2="10" y2="18"/>
    <line x1="76" y1="64" x2="112" y2="52"/>
  </g>
  <g fill="#aab6de" opacity="0.9">
    <circle cx="10" cy="18" r="2.2"/>
    <circle cx="58" cy="10" r="2.6"/>
    <circle cx="92" cy="34" r="2"/>
    <circle cx="40" cy="46" r="3"/>
    <circle cx="10" cy="60" r="2"/>
    <circle cx="76" cy="64" r="2.4"/>
    <circle cx="112" cy="52" r="1.8"/>
  </g>
  <circle cx="40" cy="46" r="6.5" stroke="#c7d0e6" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- top-right dotted grid -->
  <g fill="#c9d1e8" opacity="0.7">
    <circle cx="540" cy="14" r="1.6"/><circle cx="556" cy="14" r="1.6"/><circle cx="572" cy="14" r="1.6"/><circle cx="588" cy="14" r="1.6"/>
    <circle cx="540" cy="28" r="1.6"/><circle cx="556" cy="28" r="1.6"/><circle cx="572" cy="28" r="1.6"/><circle cx="588" cy="28" r="1.6"/>
    <circle cx="540" cy="42" r="1.6"/><circle cx="556" cy="42" r="1.6"/><circle cx="572" cy="42" r="1.6"/><circle cx="588" cy="42" r="1.6"/>
    <circle cx="540" cy="56" r="1.6"/><circle cx="556" cy="56" r="1.6"/><circle cx="572" cy="56" r="1.6"/><circle cx="588" cy="56" r="1.6"/>
  </g>

  <!-- bottom-right hex honeycomb -->
  <g stroke="#ccd4ea" stroke-width="1" fill="none" opacity="0.75">
    <polygon points="520,190 534,182 548,190 548,206 534,214 520,206"/>
    <polygon points="548,206 562,198 576,206 576,222 562,230 548,222"/>
    <polygon points="492,206 506,198 520,206 520,222 506,230 492,222"/>
    <polygon points="520,222 534,214 548,222 548,238 534,246 520,238"/>
    <polygon points="548,238 562,230 576,238 576,254 562,262 548,254"/>
    <polygon points="576,222 590,214 600,220 600,238 590,246 576,238"/>
  </g>
  <g fill="#aab6de" opacity="0.6">
    <circle cx="534" cy="182" r="1.5"/>
    <circle cx="562" cy="198" r="1.5"/>
    <circle cx="534" cy="214" r="1.5"/>
  </g>

  <!-- bottom-left circuit lines -->
  <g stroke="#ccd4ea" stroke-width="1" fill="none" opacity="0.7">
    <path d="M14 190 V230 H34 V254"/>
    <path d="M34 254 H60"/>
    <path d="M46 190 V214 H70"/>
  </g>
  <g fill="#aab6de" opacity="0.7">
    <circle cx="14" cy="190" r="1.8"/>
    <circle cx="46" cy="190" r="1.8"/>
    <circle cx="70" cy="214" r="1.8"/>
    <circle cx="60" cy="254" r="1.8"/>
  </g>
  <rect x="26" y="222" width="6" height="6" stroke="#ccd4ea" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- faint flowing wave along the bottom -->
  <g stroke="#d7ddef" stroke-width="1" fill="none" opacity="0.9">
    <path d="M0 250 C 100 230, 200 268, 300 246 S 500 230, 600 252"/>
    <path d="M0 262 C 110 246, 220 276, 320 258 S 500 244, 600 264"/>
    <path d="M0 272 C 130 260, 240 286, 340 270 S 520 256, 600 274"/>
  </g>
